<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabela</title>
    <link rel="stylesheet" href="assets/Tabela.css">
</head>
<body>
<table>
    <thead>
    <tr>
        <th colspan="2">Nome</th>
        <th>Idade</th>
        <th>CPF</th>
    </tr>

    </thead>
    <tbody>
    <!-- tr define uma linha -->
    <tr>
        <!-- td define uma célula -->
        <td>João</td>
        <td>Pedro</td>
        <td>16</td>
        <td>999.999.999-99</td>
    </tr>
    <tr>
        <td>Ana</td>
        <td>Beatriz</td>
        <td>16</td>
        <td>999.999.999-98</td>
    </tr>
    </tbody>
</table>


</body>
</html>
